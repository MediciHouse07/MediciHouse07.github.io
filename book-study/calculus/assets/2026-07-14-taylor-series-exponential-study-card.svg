<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
  <title id="title">Deriving the Taylor Series of e to the x</title>
  <desc id="desc">A study poster showing how matching derivatives at zero gives the coefficients one over n factorial.</desc>
  <defs>
    <style>
      .bg{fill:#fffdf9}.ink{fill:#102a5c}.body{fill:#20242a}.muted{fill:#596273}.blue{fill:#1e5eb8}.green{fill:#2d7b3f}.red{fill:#c7382f}.purple{fill:#7443a8}.orange{fill:#d8751e}.gold{fill:#f7c84b}
      .stroke{stroke:#173a73;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#7a8596;stroke-width:2;fill:none}.dash{stroke:#7a8596;stroke-width:2;fill:none;stroke-dasharray:8 8}
      .title{font:700 54px 'Trebuchet MS',Arial,sans-serif}.h2{font:700 28px 'Trebuchet MS',Arial,sans-serif}.h3{font:700 23px 'Trebuchet MS',Arial,sans-serif}
      .txt{font:21px 'Trebuchet MS',Arial,sans-serif}.small{font:18px 'Trebuchet MS',Arial,sans-serif}.math{font:italic 28px Georgia,'Times New Roman',serif}.mathBig{font:italic 42px Georgia,'Times New Roman',serif}
      .panel{fill:#ffffff;stroke:#173a73;stroke-width:3}.softBlue{fill:#eef5ff;stroke:#2b67b0;stroke-width:3}.softGreen{fill:#eff9ef;stroke:#4f9658;stroke-width:3}.softGold{fill:#fff7d9;stroke:#d89b20;stroke-width:3}.softRed{fill:#fff2f1;stroke:#c64a42;stroke-width:3}
    </style>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1e5eb8"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c7382f"/></marker>
    <clipPath id="graphClip"><rect x="1030" y="145" width="330" height="235" rx="12"/></clipPath>
  </defs>
  <rect width="1440" height="1080" class="bg"/>
  <text x="720" y="70" text-anchor="middle" class="title ink">Deriving the Taylor Series of e<tspan baseline-shift="super" font-size="34">x</tspan></text>
  <path d="M205 90 C420 105 980 78 1228 92" class="stroke"/>
  <rect x="40" y="118" width="455" height="92" rx="16" class="softBlue"/>
  <text x="64" y="149" class="small blue">Start with an unknown polynomial:</text>
  <text x="64" y="185" class="math body">P(x) = a₀ + a₁x + a₂x² + a₃x³ + ···</text>
  <rect x="535" y="118" width="430" height="92" rx="16" class="softGold"/>
  <text x="750" y="150" text-anchor="middle" class="h3 body">Central idea</text>
  <text x="750" y="181" text-anchor="middle" class="txt body">Match the value and all derivatives at x = 0.</text>
  <rect x="1000" y="118" width="400" height="298" rx="18" class="softBlue"/>
  <text x="1200" y="151" text-anchor="middle" class="h2 blue">The function e<tspan baseline-shift="super" font-size="18">x</tspan></text>
  <g clip-path="url(#graphClip)">
    <line x1="1055" y1="365" x2="1365" y2="365" class="thin"/>
    <line x1="1178" y1="390" x2="1178" y2="175" class="thin"/>
    <path d="M1035 352 C1085 346 1118 334 1145 313 C1170 293 1192 265 1215 230 C1240 191 1268 151 1310 120" fill="none" stroke="#1e5eb8" stroke-width="5"/>
    <circle cx="1178" cy="300" r="6" fill="#1e5eb8"/><circle cx="1238" cy="197" r="6" fill="#1e5eb8"/><circle cx="1118" cy="333" r="6" fill="#1e5eb8"/>
    <text x="1188" y="294" class="small body">(0,1)</text><text x="1248" y="191" class="small body">(1,e)</text><text x="1058" y="328" class="small body">(-1,1/e)</text>
    <text x="1325" y="145" class="math blue">y = eˣ</text><text x="1360" y="386" class="small body">x</text><text x="1162" y="187" class="small body">y</text>
  </g>
  <rect x="1075" y="374" width="250" height="32" rx="8" fill="#fff" stroke="#2b67b0" stroke-width="2"/><text x="1200" y="397" text-anchor="middle" class="small blue">Always positive and growing</text>
  <rect x="40" y="245" width="920" height="82" rx="14" class="softRed"/>
  <circle cx="78" cy="286" r="25" fill="#c7382f"/><text x="78" y="294" text-anchor="middle" font-size="24" fill="#fff" font-family="Arial" font-weight="700">1</text><text x="120" y="278" class="h3 red">At x = 0</text><text x="318" y="294" class="math body">P(0)=a₀,   e⁰=1</text><line x1="670" y1="286" x2="760" y2="286" stroke="#c7382f" stroke-width="4" marker-end="url(#arrowRed)"/><text x="792" y="295" class="math red">a₀ = 1</text>
  <rect x="40" y="343" width="920" height="82" rx="14" class="softGreen"/>
  <circle cx="78" cy="384" r="25" fill="#4f9658"/><text x="78" y="392" text-anchor="middle" font-size="24" fill="#fff" font-family="Arial" font-weight="700">2</text><text x="120" y="377" class="h3 green">First derivative</text><text x="318" y="392" class="math body">P′(0)=a₁,   (eˣ)′ at 0 = 1</text><line x1="670" y1="384" x2="760" y2="384" stroke="#2d7b3f" stroke-width="4" marker-end="url(#arrowBlue)"/><text x="792" y="393" class="math green">a₁ = 1</text>
  <rect x="40" y="441" width="920" height="82" rx="14" fill="#f5f0ff" stroke="#7443a8" stroke-width="3"/>
  <circle cx="78" cy="482" r="25" fill="#7443a8"/><text x="78" y="490" text-anchor="middle" font-size="24" fill="#fff" font-family="Arial" font-weight="700">3</text><text x="120" y="475" class="h3 purple">Second derivative</text><text x="318" y="490" class="math body">P″(0)=2a₂,   (eˣ)″ at 0 = 1</text><line x1="670" y1="482" x2="760" y2="482" stroke="#7443a8" stroke-width="4" marker-end="url(#arrowBlue)"/><text x="792" y="491" class="math purple">a₂ = 1/2!</text>
  <rect x="40" y="539" width="920" height="82" rx="14" fill="#fff5e9" stroke="#d8751e" stroke-width="3"/>
  <circle cx="78" cy="580" r="25" fill="#d8751e"/><text x="78" y="588" text-anchor="middle" font-size="24" fill="#fff" font-family="Arial" font-weight="700">4</text><text x="120" y="573" class="h3 orange">Third derivative</text><text x="318" y="588" class="math body">P‴(0)=3!a₃,   (eˣ)‴ at 0 = 1</text><line x1="670" y1="580" x2="760" y2="580" stroke="#d8751e" stroke-width="4" marker-end="url(#arrowBlue)"/><text x="792" y="589" class="math orange">a₃ = 1/3!</text>
  <rect x="40" y="637" width="920" height="104" rx="14" class="softBlue"/>
  <circle cx="78" cy="689" r="25" fill="#1e5eb8"/><text x="78" y="697" text-anchor="middle" font-size="24" fill="#fff" font-family="Arial" font-weight="700">5</text><text x="120" y="681" class="h3 blue">General term</text><text x="318" y="680" class="math body">dⁿ/dxⁿ (aₙxⁿ) = n!aₙ</text><text x="318" y="719" class="txt body">Since (eˣ)⁽ⁿ⁾(0)=1, we get n!aₙ=1.</text><line x1="690" y1="689" x2="770" y2="689" stroke="#1e5eb8" stroke-width="4" marker-end="url(#arrowBlue)"/><text x="800" y="699" class="math blue">aₙ = 1/n!</text>
  <rect x="1000" y="438" width="400" height="260" rx="18" class="softGreen"/>
  <text x="1025" y="476" class="h2 green">Why the factorial?</text><text x="1025" y="514" class="txt body">Differentiating xⁿ exactly n times gives n!.</text><text x="1052" y="560" class="math body">d/dx xⁿ = nxⁿ⁻¹</text><text x="1052" y="600" class="math body">d²/dx² xⁿ = n(n−1)xⁿ⁻²</text><text x="1052" y="640" class="math body">⋮</text><text x="1052" y="678" class="math green">dⁿ/dxⁿ xⁿ = n!</text>
  <rect x="1000" y="718" width="400" height="214" rx="18" class="softRed"/>
  <text x="1025" y="755" class="h2 red">Why coefficient 1 fails</text><text x="1025" y="792" class="txt body">For eˣ at 0:</text><text x="1025" y="824" class="math red">1, 1, 1, 1, …</text><text x="1025" y="861" class="txt body">For 1+x+x²+x³+…:</text><text x="1025" y="895" class="math body">1, 1, 2, 6, 24, …</text><text x="1250" y="920" text-anchor="middle" class="h3 red">Not the same</text>
  <rect x="40" y="770" width="920" height="132" rx="18" class="softGold"/>
  <text x="68" y="810" class="h2 orange">Therefore</text><text x="500" y="864" text-anchor="middle" class="mathBig body">eˣ = 1 + x + x²/2! + x³/3! + ··· + xⁿ/n! + ···</text>
  <rect x="235" y="930" width="970" height="108" rx="18" class="softBlue"/>
  <text x="720" y="968" text-anchor="middle" class="h2 blue">Final takeaway</text><text x="720" y="1006" text-anchor="middle" class="txt body">Matching all derivatives at zero forces the only possible coefficients: aₙ = 1/n!.</text>
</svg>