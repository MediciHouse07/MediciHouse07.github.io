<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Hessian of S(m,b): local shape from determinant</title>
  <desc id="desc">Four panels showing how the Hessian determinant classifies a two-parameter surface as a bowl, hill, saddle, or inconclusive flat case.</desc>
  <rect width="1200" height="800" fill="#fbfaf7"/>
  <style>
    .title{font:700 38px Georgia,serif;fill:#18233a}.panel-title{font:700 28px Georgia,serif}.label{font:600 22px Georgia,serif;fill:#1f2937}.small{font:18px Georgia,serif;fill:#4b5563}.math{font:24px Georgia,serif;fill:#111827}.axis{stroke:#1f2937;stroke-width:3;fill:none;stroke-linecap:round}.grid{stroke:#334155;stroke-width:1.2;opacity:.35}.panel{fill:#fff;stroke:#202124;stroke-width:2}.note{fill:#f7f7f7;stroke:#d1d5db;stroke-width:1.5}.arrow{stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.dot{fill:#111827}
  </style>
  <text x="600" y="52" text-anchor="middle" class="title">Hessian of S(m,b): What Shape Is the Error Surface?</text>
  <line x1="56" y1="72" x2="1144" y2="72" stroke="#18233a" stroke-width="3"/>

  <rect x="30" y="95" width="560" height="250" rx="14" class="panel"/>
  <rect x="610" y="95" width="560" height="250" rx="14" class="panel"/>
  <rect x="30" y="365" width="560" height="250" rx="14" class="panel"/>
  <rect x="610" y="365" width="560" height="250" rx="14" class="panel"/>

  <circle cx="66" cy="132" r="24" fill="#5f8d5a"/><text x="66" y="141" text-anchor="middle" font-size="28" fill="#fff" font-weight="700">1</text>
  <text x="310" y="132" text-anchor="middle" class="panel-title" fill="#2f6b37">Bowl / minimum</text>
  <path d="M90 285 L255 198 L415 285" class="axis"/><path d="M255 198 L255 122" class="axis"/><text x="74" y="305" class="label">m</text><text x="425" y="303" class="label">b</text><text x="210" y="122" class="label">S(m,b)</text>
  <path d="M120 155 C170 305 345 305 395 155" fill="#d8ecd0" stroke="#315f35" stroke-width="2"/>
  <path d="M130 170 C185 245 330 245 385 170" class="grid"/><path d="M145 205 C200 270 315 270 370 205" class="grid"/><path d="M178 236 C215 272 300 272 337 236" class="grid"/><path d="M180 183 C190 235 205 262 226 282" class="grid"/><path d="M335 183 C325 235 310 262 289 282" class="grid"/>
  <ellipse cx="255" cy="292" rx="92" ry="20" fill="none" stroke="#64748b" stroke-dasharray="8 7"/><circle cx="255" cy="285" r="7" class="dot"/>
  <text x="438" y="184" class="math">det(H) &gt; 0</text><text x="438" y="220" class="math">Smm &gt; 0</text><text x="438" y="270" class="label" fill="#2f6b37">positive definite</text>

  <circle cx="646" cy="132" r="24" fill="#557faa"/><text x="646" y="141" text-anchor="middle" font-size="28" fill="#fff" font-weight="700">2</text>
  <text x="890" y="132" text-anchor="middle" class="panel-title" fill="#225c9a">Hill / maximum</text>
  <path d="M670 285 L835 198 L995 285" class="axis"/><path d="M835 198 L835 122" class="axis"/><text x="654" y="305" class="label">m</text><text x="1005" y="303" class="label">b</text><text x="790" y="122" class="label">S(m,b)</text>
  <path d="M700 250 C760 105 910 105 970 250" fill="#dcecff" stroke="#245b93" stroke-width="2"/>
  <path d="M715 232 C770 180 900 180 955 232" class="grid"/><path d="M735 204 C785 150 885 150 935 204" class="grid"/><path d="M760 180 C800 130 870 130 910 180" class="grid"/><path d="M760 247 C780 172 802 135 835 116" class="grid"/><path d="M910 247 C890 172 868 135 835 116" class="grid"/>
  <ellipse cx="835" cy="292" rx="92" ry="20" fill="none" stroke="#64748b" stroke-dasharray="8 7"/><circle cx="835" cy="116" r="7" class="dot"/>
  <text x="1018" y="184" class="math">det(H) &gt; 0</text><text x="1018" y="220" class="math">Smm &lt; 0</text><text x="1018" y="270" class="label" fill="#225c9a">negative definite</text>

  <circle cx="66" cy="402" r="24" fill="#7d5aa0"/><text x="66" y="411" text-anchor="middle" font-size="28" fill="#fff" font-weight="700">3</text>
  <text x="310" y="402" text-anchor="middle" class="panel-title" fill="#6a3191">Saddle</text>
  <path d="M90 555 L255 468 L415 555" class="axis"/><path d="M255 468 L255 392" class="axis"/><text x="74" y="575" class="label">m</text><text x="425" y="573" class="label">b</text><text x="210" y="392" class="label">S(m,b)</text>
  <path d="M115 445 C170 330 225 558 285 480 C345 402 362 330 400 445" fill="#eadcf6" stroke="#6a3191" stroke-width="2"/>
  <path d="M130 455 C190 420 320 420 385 455" class="grid"/><path d="M150 430 C205 472 305 472 360 430" class="grid"/><path d="M176 397 C215 502 295 502 334 397" class="grid"/>
  <circle cx="255" cy="468" r="7" class="dot"/>
  <path d="M82 500 L82 440" class="arrow" stroke="#6a3191"/><path d="M82 440 l-10 17 m10-17 l10 17" stroke="#6a3191" stroke-width="4"/><path d="M420 430 L420 505" class="arrow" stroke="#2563eb"/><path d="M420 505 l-10-17 m10 17 l10-17" stroke="#2563eb" stroke-width="4"/>
  <text x="438" y="470" class="math">det(H) &lt; 0</text><text x="438" y="520" class="label" fill="#6a3191">mixed directions</text>

  <circle cx="646" cy="402" r="24" fill="#b38a2c"/><text x="646" y="411" text-anchor="middle" font-size="28" fill="#fff" font-weight="700">4</text>
  <text x="890" y="402" text-anchor="middle" class="panel-title" fill="#9a6a00">Flat / inconclusive</text>
  <path d="M670 555 L835 468 L995 555" class="axis"/><path d="M835 468 L835 392" class="axis"/><text x="654" y="575" class="label">m</text><text x="1005" y="573" class="label">b</text><text x="790" y="392" class="label">S(m,b)</text>
  <path d="M700 500 C770 455 900 455 970 500 C900 532 770 532 700 500" fill="#fff0c2" stroke="#9a6a00" stroke-width="2"/>
  <path d="M720 497 C785 478 885 478 950 497" class="grid"/><path d="M735 512 C790 500 880 500 935 512" class="grid"/><path d="M760 485 C780 506 890 506 910 485" class="grid"/>
  <ellipse cx="835" cy="565" rx="92" ry="20" fill="none" stroke="#64748b" stroke-dasharray="8 7"/><text x="820" y="465" font-size="64" fill="#9a6a00">?</text>
  <text x="1018" y="470" class="math">det(H) = 0</text><text x="1018" y="520" class="label" fill="#9a6a00">test cannot decide</text>

  <rect x="30" y="635" width="1140" height="130" rx="14" class="note"/>
  <text x="80" y="705" class="math">H = [ [ Smm, Smb ], [ Sbm, Sbb ] ]</text>
  <line x1="520" y1="660" x2="520" y2="742" stroke="#9ca3af" stroke-dasharray="8 8"/>
  <text x="575" y="705" class="math">det(H) = Smm Sbb - (Smb)^2</text>
  <line x1="60" y1="735" x2="1140" y2="735" stroke="#225c9a" stroke-width="2" stroke-dasharray="7 8"/>
  <text x="600" y="756" text-anchor="middle" class="small" fill="#225c9a">S(m,b): one point is one candidate line y = mx + b</text>
</svg>