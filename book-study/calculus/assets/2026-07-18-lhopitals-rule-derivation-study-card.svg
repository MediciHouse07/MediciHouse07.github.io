<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">How L'Hôpital's rule is derived in the zero over zero case</title>
  <desc id="desc">A five-step diagram from a zero over zero quotient through Cauchy's mean value theorem and the squeeze of the intermediate point c to the derivative quotient limit.</desc>
  <defs>
    <style>
      .bg{fill:#fffdfa}.ink{fill:#172033}.muted{fill:#5d6676}.blue{fill:#1f5fae}.green{fill:#317b4a}.gold{fill:#a66a13}.red{fill:#b43d3d}
      .panel{fill:#fff;stroke:#d5dbe5;stroke-width:2}.bluePanel{fill:#eef5ff;stroke:#8eb4e8;stroke-width:2}.greenPanel{fill:#eef8f1;stroke:#94c5a4;stroke-width:2}.goldPanel{fill:#fff7e6;stroke:#d7ad62;stroke-width:2}.redPanel{fill:#fff2f2;stroke:#db9999;stroke-width:2}
      .title{font:700 50px Arial,sans-serif}.h2{font:700 28px Arial,sans-serif}.h3{font:700 22px Arial,sans-serif}.txt{font:20px Arial,sans-serif}.small{font:17px Arial,sans-serif}.math{font:italic 29px Georgia,serif}.mathBig{font:italic 39px Georgia,serif}
      .line{stroke:#1f5fae;stroke-width:4;fill:none;stroke-linecap:round}.thin{stroke:#5d6676;stroke-width:2;fill:none}.dash{stroke:#317b4a;stroke-width:4;stroke-dasharray:10 8;fill:none}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1f5fae"/></marker>
  </defs>
  <rect width="1440" height="980" class="bg"/>
  <text x="720" y="62" text-anchor="middle" class="title blue">How L'Hôpital's Rule Is Derived</text>
  <text x="720" y="98" text-anchor="middle" class="h3 muted">The 0/0 case: total change → derivative ratio → limit</text>

  <rect x="36" y="126" width="1368" height="126" rx="18" class="bluePanel"/>
  <circle cx="90" cy="189" r="34" fill="#1f5fae"/><text x="90" y="200" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#fff">1</text>
  <text x="145" y="169" class="h2 blue">Start with an indeterminate quotient</text>
  <text x="150" y="220" class="math ink">limₓ→ₐ f(x)/g(x),   where f(a)=0 and g(a)=0</text>
  <rect x="1020" y="151" width="325" height="76" rx="14" class="panel"/>
  <text x="1182" y="181" text-anchor="middle" class="small muted">At x=a the expression looks like</text>
  <text x="1182" y="215" text-anchor="middle" class="math red">0 / 0</text>

  <rect x="36" y="272" width="1368" height="142" rx="18" class="panel"/>
  <circle cx="90" cy="343" r="34" fill="#1f5fae"/><text x="90" y="354" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#fff">2</text>
  <text x="145" y="316" class="h2 blue">Rewrite it as a ratio of changes</text>
  <text x="150" y="370" class="math ink">f(x)/g(x) = [f(x)−f(a)] / [g(x)−g(a)]</text>
  <text x="150" y="401" class="small muted">because f(a)=g(a)=0</text>
  <g transform="translate(900 292)">
    <line x1="30" y1="88" x2="390" y2="88" class="thin"/><line x1="76" y1="112" x2="76" y2="15" class="thin"/>
    <path d="M80 87 C150 80 205 60 250 32 C300 3 335 12 382 21" class="line"/>
    <circle cx="76" cy="88" r="6" fill="#172033"/><circle cx="314" cy="20" r="7" fill="#1f5fae"/>
    <line x1="76" y1="88" x2="314" y2="20" stroke="#a66a13" stroke-width="4"/>
    <text x="320" y="18" class="small blue">x</text><text x="58" y="109" class="small ink">a</text><text x="196" y="74" class="small gold">secant / 割线</text>
  </g>

  <rect x="36" y="434" width="1368" height="178" rx="18" class="goldPanel"/>
  <circle cx="90" cy="523" r="34" fill="#a66a13"/><text x="90" y="534" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#fff">3</text>
  <text x="145" y="477" class="h2 gold">Cauchy's generalized mean value theorem</text>
  <text x="150" y="531" class="math ink">For some c between a and x:</text>
  <text x="150" y="579" class="mathBig ink">[f(x)−f(a)]/[g(x)−g(a)] = f′(c)/g′(c)</text>
  <g transform="translate(980 475)">
    <line x1="20" y1="73" x2="340" y2="73" class="thin"/>
    <circle cx="50" cy="73" r="8" fill="#172033"/><circle cx="188" cy="73" r="9" fill="#a66a13"/><circle cx="320" cy="73" r="8" fill="#172033"/>
    <text x="43" y="105" class="small ink">a</text><text x="181" y="105" class="small gold">c</text><text x="314" y="105" class="small ink">x</text>
    <path d="M54 42 Q185 2 316 42" class="thin"/><text x="184" y="24" text-anchor="middle" class="small muted">c is trapped between a and x</text>
  </g>

  <rect x="36" y="632" width="1368" height="142" rx="18" class="greenPanel"/>
  <circle cx="90" cy="703" r="34" fill="#317b4a"/><text x="90" y="714" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#fff">4</text>
  <text x="145" y="676" class="h2 green">Let x approach a</text>
  <text x="150" y="728" class="math ink">|c−a| ≤ |x−a|, so x→a forces c→a</text>
  <path d="M790 704 L970 704" class="line" marker-end="url(#arrow)"/>
  <text x="1005" y="695" class="small muted">If f′(t)/g′(t)→L as t→a,</text>
  <text x="1005" y="731" class="math green">then f′(c)/g′(c)→L</text>

  <rect x="36" y="794" width="1368" height="150" rx="18" class="bluePanel"/>
  <circle cx="90" cy="869" r="34" fill="#1f5fae"/><text x="90" y="880" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#fff">5</text>
  <text x="145" y="838" class="h2 blue">Conclusion: L'Hôpital's rule</text>
  <text x="155" y="900" class="mathBig ink">limₓ→ₐ f(x)/g(x) = limₓ→ₐ f′(x)/g′(x)</text>
  <rect x="960" y="819" width="385" height="102" rx="14" class="panel"/>
  <text x="1152" y="851" text-anchor="middle" class="small muted">Example</text>
  <text x="1152" y="889" text-anchor="middle" class="math ink">limₓ→₀ (eˣ−1)/x = 1</text>

  <text x="720" y="968" text-anchor="middle" class="small muted">Key bridge: a ratio of total changes equals a ratio of instantaneous changes at a nearby point c.</text>
</svg>
