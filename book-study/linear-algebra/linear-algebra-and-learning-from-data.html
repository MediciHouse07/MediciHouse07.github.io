  <script>
    (function() {
      var frame = document.getElementById('study-note-frame');
      var sourceUrl = 'https://raw.githubusercontent.com/MediciHouse07/Learning_Records/main/book-study/linear-algebra-and-learning-from-data.html';

      function resizeFrame() {
        try {
          var doc = frame.contentDocument || frame.contentWindow.document;
          var height = Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight);
          frame.style.height = Math.max(height + 24, window.innerHeight - 240) + 'px';
        } catch (error) {}
      }

      frame.srcdoc = '<!doctype html><html><body style="margin:0;padding:24px;font-family:sans-serif;color:#666;background:#fbfaf7;">Loading study note...</body></html>';
      frame.addEventListener('load', function() {
        resizeFrame();
        window.setTimeout(resizeFrame, 100);
        window.setTimeout(resizeFrame, 500);
      });

      fetch(sourceUrl)
        .then(function(response) {
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return response.text();
        })
        .then(function(html) {
          frame.srcdoc = html;
        })
        .catch(function() {
          var holder = frame.parentNode;
          holder.innerHTML = '<p class="load-fallback">The study note could not be loaded automatically. <a href="' + sourceUrl + '">Open the source HTML</a>.</p>';
        });
    })();
  </script>
