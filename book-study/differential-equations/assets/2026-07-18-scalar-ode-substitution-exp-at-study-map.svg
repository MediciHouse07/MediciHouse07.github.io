<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">From scalar decay to matrix exponentials</title>
  <desc id="desc">Three-panel study map connecting scalar differential equations, separation and substitution, zero-crossing restrictions, and eigenvalue solutions of matrix differential systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#fffaf2"/>
    </linearGradient>
    <style>
      .title{font:700 38px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
      .subtitle{font:500 18px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596275}
      .head{font:700 24px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172033}
      .body{font:500 17px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#384154}
      .small{font:500 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#596275}
      .math{font:600 24px Georgia,"Times New Roman",serif;fill:#172033}
      .mathsmall{font:600 19px Georgia,"Times New Roman",serif;fill:#172033}
      .label{font:700 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#2b65c8"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#16815b"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#7146a8"/></marker>
  </defs>
  <rect width="1200" height="760" rx="24" fill="url(#bg)"/>
  <text x="600" y="55" text-anchor="middle" class="title">From scalar decay to matrix exponentials</text>
  <text x="600" y="86" text-anchor="middle" class="subtitle">One learning path: initial value → exponential mode → substitution → eigenvalue mode</text>

  <rect x="35" y="120" width="350" height="540" rx="20" fill="#ffffff" stroke="#9abcf3" stroke-width="3"/>
  <circle cx="72" cy="160" r="23" fill="#2b65c8"/><text x="72" y="168" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">1</text>
  <text x="108" y="168" class="head">Scalar ODE</text>
  <text x="60" y="215" class="math">u′(t) = λu(t)</text>
  <line x1="62" y1="240" x2="350" y2="240" stroke="#d7e4f8" stroke-width="2"/>
  <text x="60" y="280" class="body">We seek a function whose derivative</text>
  <text x="60" y="306" class="body">is λ times itself.</text>
  <text x="60" y="352" class="math">u(t) = Ce<tspan baseline-shift="super" font-size="16">λt</tspan></text>
  <rect x="58" y="382" width="304" height="96" rx="14" fill="#eef5ff" stroke="#c5d9f7"/>
  <text x="78" y="414" class="label" fill="#2b65c8">C = u(0)</text>
  <text x="78" y="443" class="body">C sets the starting amount.</text>
  <text x="78" y="468" class="body">λ sets growth, decay, or oscillation.</text>
  <line x1="72" y1="525" x2="342" y2="525" stroke="#2b65c8" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="68" y="555" class="small">λ &lt; 0: decay</text>
  <text x="179" y="555" class="small">λ = 0: steady</text>
  <text x="281" y="555" class="small">λ &gt; 0: growth</text>
  <text x="60" y="605" class="small">Complex λ adds oscillation; a negative real</text>
  <text x="60" y="628" class="small">part makes that oscillation decay.</text>

  <rect x="425" y="120" width="350" height="540" rx="20" fill="#ffffff" stroke="#8bd3b8" stroke-width="3"/>
  <circle cx="462" cy="160" r="23" fill="#16815b"/><text x="462" y="168" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">2</text>
  <text x="498" y="168" class="head">Separate and substitute</text>
  <text x="450" y="214" class="mathsmall">u′/u = λ</text>
  <text x="450" y="248" class="mathsmall">∫ [u′(t)/u(t)] dt = ∫ λ dt</text>
  <text x="450" y="282" class="mathsmall">s = u(t),  ds = u′(t)dt</text>
  <text x="450" y="316" class="mathsmall">∫ 1/s ds = λt + K</text>
  <rect x="448" y="344" width="304" height="122" rx="14" fill="#edf9f4" stroke="#bfe7d7"/>
  <text x="468" y="378" class="label" fill="#16815b">Same integral, new coordinate</text>
  <text x="468" y="408" class="body">Both sides were first integrated in t.</text>
  <text x="468" y="435" class="body">Substitution only rewrites the left side.</text>
  <line x1="470" y1="514" x2="730" y2="514" stroke="#172033" stroke-width="3"/>
  <circle cx="488" cy="514" r="8" fill="#16815b"/><text x="470" y="547" class="small">u(0)</text>
  <circle cx="600" cy="514" r="9" fill="#cc3344"/><text x="593" y="547" class="small" fill="#cc3344">0</text>
  <circle cx="712" cy="514" r="8" fill="#16815b"/><text x="690" y="547" class="small">u(T)</text>
  <path d="M500 495 C535 470,565 470,590 495" fill="none" stroke="#16815b" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M612 495 C640 470,672 470,700 495" fill="none" stroke="#16815b" stroke-width="4" marker-end="url(#arrow-green)"/>
  <rect x="448" y="570" width="304" height="66" rx="14" fill="#fff0f1" stroke="#efb6bd"/>
  <text x="468" y="597" class="label" fill="#b92d3d">Zero restriction</text>
  <text x="468" y="622" class="small">If u(t)=0, both u′/u and 1/s are undefined.</text>

  <rect x="815" y="120" width="350" height="540" rx="20" fill="#ffffff" stroke="#c5a9e6" stroke-width="3"/>
  <circle cx="852" cy="160" r="23" fill="#7146a8"/><text x="852" y="168" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">3</text>
  <text x="888" y="168" class="head">Matrix bridge</text>
  <text x="840" y="216" class="math">u′(t) = Au(t)</text>
  <text x="840" y="258" class="body">An eigenvector direction behaves like</text>
  <text x="840" y="284" class="body">the scalar equation.</text>
  <text x="840" y="330" class="mathsmall">Ax = λx</text>
  <line x1="940" y1="323" x2="1040" y2="323" stroke="#7146a8" stroke-width="4" marker-end="url(#arrow-purple)"/>
  <text x="840" y="374" class="mathsmall">mode(t) = c e<tspan baseline-shift="super" font-size="14">λt</tspan>x</text>
  <rect x="838" y="402" width="304" height="111" rx="14" fill="#f5f0fb" stroke="#d8c6ec"/>
  <text x="858" y="435" class="label" fill="#7146a8">Initial vector determines coefficients</text>
  <text x="858" y="465" class="body">u(0) = c₁x₁ + c₂x₂ + ···</text>
  <text x="858" y="493" class="body">Each coefficient follows e<tspan baseline-shift="super" font-size="12">λᵢt</tspan>.</text>
  <text x="840" y="557" class="math">u(t) = e<tspan baseline-shift="super" font-size="16">At</tspan>u(0)</text>
  <text x="840" y="598" class="small">The matrix exponential packages all</text>
  <text x="840" y="622" class="small">eigenvalue modes into one operator.</text>

  <rect x="120" y="687" width="960" height="48" rx="16" fill="#172033"/>
  <text x="600" y="718" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Key connection: λ controls one exponential mode; eigenvalues control the modes of a matrix differential system.</text>
</svg>